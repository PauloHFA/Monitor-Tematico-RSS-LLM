[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "newsbrief-ai"
version = "0.1.0"
description = "Telegram news briefings powered by RSS and local Ollama summaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20,<1",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.2,<3",
    "python-telegram-bot>=21,<23",
    "PyYAML>=6,<7",
    "rapidfuzz>=3.9,<4",
    "structlog>=24,<26",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
newsbrief = "newsbrief.main:main"

[tool.hatch.build.targets.wheel]
packages = ["newsbrief"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=newsbrief --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["newsbrief"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "types-pyyaml>=6,<7",
]

