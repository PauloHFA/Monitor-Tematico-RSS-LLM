services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /app/data/newsbrief.db
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - newsbrief-data:/app/data
    restart: unless-stopped

volumes:
  newsbrief-data:
